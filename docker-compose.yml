name: newswire

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # management UI
    environment:
      RABBITMQ_DEFAULT_USER: newswire
      RABBITMQ_DEFAULT_PASS: newswire
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  postgres:
    image: postgres:16-alpine
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: newswire
      POSTGRES_PASSWORD: newswire
      POSTGRES_DB: newswire
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newswire -d newswire"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

  # --- Pipeline -------------------------------------------------------------
  # Both wait for healthy infrastructure: RabbitMQ needs ~25s to accept
  # connections, and starting without it would crash-loop on first boot.

  poller:
    build: .
    command: python -m services.poller.main
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis:    {condition: service_healthy}
    environment: &pipeline_env
      RABBITMQ_HOST: rabbitmq
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-600}
    restart: unless-stopped

  enricher:
    build: .
    command: python -m services.enricher.main
    depends_on:
      rabbitmq: {condition: service_healthy}
      redis:    {condition: service_healthy}
      postgres: {condition: service_healthy}
    environment: *pipeline_env
    restart: unless-stopped
    # No container_name and no host port binding, so `--scale enricher=N`
    # works without collisions.

volumes:
  rabbitmq_data:
  postgres_data:
  redis_data:
